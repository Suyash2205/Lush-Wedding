# Production deploy to Vercel on every push to `main`.
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN        — https://vercel.com/account/tokens
#   VERCEL_ORG_ID       — Vercel project → Settings → General
#   VERCEL_PROJECT_ID   — Vercel project → Settings → General
#
# If this repo is already connected under Vercel → Project → Settings → Git,
# Vercel also deploys on each push. Use EITHER Git integration OR this
# workflow to avoid two production deploys per push.

name: Deploy to Vercel

on:
  push:
    branches:
      - main

concurrency:
  group: vercel-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel (production)
        run: npx vercel@latest deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
